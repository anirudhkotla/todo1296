<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blue Todo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="todo-panel" aria-labelledby="app-title">
      <div class="header-row">
        <div>
          <p class="eyebrow">Today</p>
          <h1 id="app-title">Blue Todo</h1>
        </div>
        <div class="count-pill" id="task-count">0 left</div>
      </div>

      <form class="task-form" id="task-form">
        <input id="task-input" type="text" placeholder="Add a task..." autocomplete="off" required>
        <button type="submit">Add</button>
      </form>

      <div class="filters" role="group" aria-label="Task filters">
        <button class="active" type="button" data-filter="all">All</button>
        <button type="button" data-filter="active">Active</button>
        <button type="button" data-filter="completed">Done</button>
      </div>

      <ul class="task-list" id="task-list"></ul>

      <div class="empty-state" id="empty-state">
        <h2>No tasks yet</h2>
        <p>Add your first task and keep the day moving.</p>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
